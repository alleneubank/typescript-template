# Flat node_modules. React Native autolinking and packages with hardcoded
# node_modules paths expect a hoisted tree, not an isolated virtual store.
nodeLinker: node-modules

# Yarn 4.18 holds versions published in the last day. bun-types@1.4.3 shipped
# with the Bun 1.4.3 runtime, so it is allowed through that gate.
npmPreapprovedPackages:
  - '@types/bun'
  - bun-types
